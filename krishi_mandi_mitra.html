<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishi Mandi Mitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#16342A;
    --green-mid:#2D6A4F;
    --gold:#D4A017;
    --gold-soft:#F0C75E;
    --soil:#6B4226;
    --paper:#F3F1E2;
    --paper-card:#FFFEF9;
    --ink:#20261D;
    --muted:#6b6b5c;
    --low:#2D6A4F;
    --moderate:#B8860B;
    --high:#C1440E;
    --veryhigh:#7A1E1E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: linear-gradient(180deg,#0f241c 0%, #16342A 260px, var(--paper) 260px);
    font-family:'Noto Sans','Noto Sans Devanagari','Noto Sans Kannada',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    position:relative;
  }
  /* ---- Header: signboard ---- */
  header{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 8px),
      linear-gradient(180deg, var(--green-mid) 0%, var(--green-deep) 100%);
    padding:18px 18px 14px;
    color:#fbf7ec;
    position:relative;
    border-bottom:6px solid var(--gold);
  }
  .header-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-icon{
    font-size:30px;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.3));
  }
  .brand-text h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:19px;
    margin:0;
    letter-spacing:.2px;
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:12px;
    color:#cfe8da;
    font-weight:600;
  }
  #langBtn{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:12.5px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  #langBtn:hover{ background:rgba(255,255,255,0.22); }
  #langBtn:focus-visible, .chip:focus-visible, .send-btn:focus-visible, #textInput:focus-visible {
    outline:3px solid var(--gold-soft); outline-offset:2px;
  }
  /* Ticker */
  .ticker-wrap{
    margin-top:12px;
    background:rgba(0,0,0,0.22);
    border-radius:8px;
    overflow:hidden;
    white-space:nowrap;
    border:1px solid rgba(255,255,255,0.12);
  }
  .ticker-track{
    display:inline-block;
    padding:6px 0;
    animation: scrollTicker 22s linear infinite;
  }
  #ticker{
    display:inline-block;
    padding-left:100%;
    font-size:12px;
    font-weight:600;
    color:var(--gold-soft);
    letter-spacing:.2px;
  }
  @keyframes scrollTicker{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-100%); }
  }
  @media (prefers-reduced-motion: reduce){
    .ticker-track{ animation:none; }
    #ticker{ padding-left:0; }
  }

  /* ---- Chat area ---- */
  #chat{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{ display:flex; align-items:flex-end; gap:8px; max-width:100%; }
  .msg.user{ justify-content:flex-end; }
  .stub{
    flex-shrink:0;
    width:8px;
    align-self:stretch;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    align-items:center;
    padding:6px 0;
  }
  .perf{ width:4px; height:4px; border-radius:50%; background:var(--paper); box-shadow:0 0 0 1px rgba(0,0,0,.08); }
  .bubble{
    padding:12px 14px;
    border-radius:4px 14px 14px 14px;
    font-size:14.5px;
    line-height:1.5;
    max-width:82%;
  }
  .bot-bubble{
    background:var(--paper-card);
    border-left:4px dashed var(--gold);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .user-bubble{
    background:var(--green-mid);
    color:#fff;
    border-radius:14px 4px 14px 14px;
  }
  .typing{ display:flex; gap:4px; padding:14px; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--muted); opacity:.5; animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:.9; } }

  .ticket{ display:flex; flex-direction:column; gap:5px; }
  .ticket-head{ font-family:'Manrope',sans-serif; font-weight:800; font-size:14.5px; color:var(--green-deep); margin-bottom:2px; }
  .ticket-row{ font-size:13.5px; }
  .hint{ font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.4; }
  .badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:12px; font-weight:700;
    padding:2px 8px; border-radius:999px;
    background:color-mix(in srgb, var(--sc) 14%, white);
    color:var(--sc);
    border:1px solid color-mix(in srgb, var(--sc) 35%, white);
  }
  .overview-row{
    display:grid;
    grid-template-columns:1.5fr .6fr .6fr auto;
    align-items:center;
    gap:6px;
    font-size:13px;
    padding:6px 0;
    border-top:1px solid #ece7d4;
  }
  .oc-name{ font-weight:700; }

  /* ---- Quick replies ---- */
  #quickReplies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:10px 14px 4px;
  }
  .chip{
    font-family:'Manrope',sans-serif;
    font-size:13px;
    font-weight:700;
    background:#fff;
    border:1.5px solid var(--green-mid);
    color:var(--green-deep);
    padding:8px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .chip:hover{ background:var(--green-mid); color:#fff; }

  /* ---- Input bar ---- */
  #inputForm{
    display:flex;
    gap:8px;
    padding:10px 14px 16px;
    background:var(--paper);
    border-top:1px solid #e6e1cc;
  }
  #textInput{
    flex:1;
    border:1.5px solid #d9d3ba;
    background:#fff;
    border-radius:999px;
    padding:11px 16px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
  }
  #textInput:focus{ border-color:var(--green-mid); outline:none; }
  .send-btn{
    background:var(--gold);
    border:none;
    color:var(--green-deep);
    font-weight:800;
    font-family:'Manrope',sans-serif;
    font-size:14px;
    padding:0 18px;
    border-radius:999px;
    cursor:pointer;
  }
  .send-btn:hover{ background:var(--gold-soft); }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding:0 16px 12px;
  }

  #chat::-webkit-scrollbar{ width:6px; }
  #chat::-webkit-scrollbar-thumb{ background:#d9d3ba; border-radius:3px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-top">
      <div class="brand">
        <span class="brand-icon">🌾</span>
        <div class="brand-text">
          <h1 id="appTitle">Krishi Mandi Mitra</h1>
          <p id="appTagline">Your Mandi, Your Information, Your Time</p>

      </div>

  <div id="chat" role="log" aria-live="polite"></div>
  <div id="quickReplies"></div>

  <form id="inputForm">

    <button class="send-btn" type="submit">Send</button>
  </form>
  <footer id="footerHelp">Need a human? Contact your nearest procurement centre helpdesk with your Customer ID.</footer>
</div>

  rows.forEach(r => cropCount[r.crop] = (cropCount[r.crop]||0)+1);
  const topCrop = Object.entries(cropCount).sort((a,b)=>b[1]-a[1])[0][0];
  const byHour = {};
  rows.forEach(r => { (byHour[r.h] = byHour[r.h]||[]).push(r.ql); });
  const hourAvg = Object.entries(byHour).map(([h,arr])=>({h:+h, avg: arr.reduce((a,b)=>a+b,0)/arr.length}))
    .sort((a,b)=>a.avg-b.avg);
  const latest = rows.slice().sort((a,b)=> (a.bd+a.at) < (b.bd+b.at) ? 1 : -1)[0];
  return { pid, name, avgQ, avgWait, avgCounters, topCrop, hourAvg, latest, count: rows.length };
});

function centreByPid(pid){ return CENTRES.find(c => c.pid === pid); }

function queueStatus(q){
  if (q < 15) return 'low';
  if (q < 27) return 'moderate';
  if (q < 40) return 'high';
  return 'veryhigh';
}

  low:      { en:'Low',        hi:'कम',        kn:'ಕಡಿಮೆ',         dot:'🟢', color:'var(--low)' },
  moderate: { en:'Moderate',   hi:'सामान्य',   kn:'ಮಧ್ಯಮ',         dot:'🟡', color:'var(--moderate)' },
  high:     { en:'High',       hi:'अधिक',      kn:'ಹೆಚ್ಚು',        dot:'🟠', color:'var(--high)' },
  veryhigh: { en:'Very High',  hi:'बहुत अधिक', kn:'ಬಹಳ ಹೆಚ್ಚು',    dot:'🔴', color:'var(--veryhigh)' },
};

function findFarmer(id){
  if(!id) return null;
  const q = id.trim().toUpperCase();
  return DATA.find(d => d.cid.toUpperCase() === q) || null;
}

function estimateWait(row){
  const c = centreByPid(row.pid);
  const centreRows = DATA.filter(d=>d.pid===row.pid);
  const avgTokensAhead = centreRows.reduce((s,r)=>s+r.ta,0)/centreRows.length || 1;
  const ratio = avgTokensAhead > 0 ? (row.ta / avgTokensAhead) : 1;
  const est = Math.max(5, Math.round(c.avgWait * ratio));
  const low = Math.max(5, Math.round(est*0.85/5)*5);
  const high = Math.round(est*1.15/5)*5;
  return {low, high};
}

function fmtHour(h){
  const ampm = h < 12 ? 'AM' : 'PM';
  let hh = h % 12; if(hh===0) hh=12;
  return `${hh}:00 ${ampm}`;
}

      <div class="ticket-row">⏱️ ${tr('Avg. Waiting Time','औसत प्रतीक्षा समय','ಸರಾಸರಿ ಕಾಯುವ ಸಮಯ')}: <b>${Math.round(c.avgWait)} ${tr('min','मिनट','ನಿಮಿಷ')}</b></div>
      <div class="ticket-row">${statusBadge(c.avgQ)}</div>
      <div class="hint">${tt().historicalNote(c.latest.bd)}</div>
    </div>`;
  addBot(html);
  setQuickReplies([{label: tr('Check another centre','दूसरा केंद्र देखें','ಬೇರೆ ಕೇಂದ್ರ ನೋಡಿ'), action: showQueueFlow}, backChip()]);
}

/* ---------- 3. Procurement centre info ---------- */
function showCentreInfoFlow(){
  addBot(tt().chooseCentre);
  setQuickReplies([
    ...CENTRES.map(c => ({label: c.name, action: ()=>renderCentreInfo(c.pid)})),
    backChip()
  ]);
}
function renderCentreInfo(pid){
  const c = centreByPid(pid);
  const best = c.hourAvg[0], worst = c.hourAvg[c.hourAvg.length-1];
  const html = `
    <div class="ticket">
      <div class="ticket-head">📍 ${c.name}</div>
      <div class="ticket-row">👥 ${tr('Avg. Queue','औसत कतार','ಸರಾಸರಿ ಸರತಿ')}: <b>${Math.round(c.avgQ)}</b> ${statusBadge(c.avgQ)}</div>
      <div class="ticket-row">🏪 ${tr('Avg. Active Counters','औसत चालू काउंटर','ಸರಾಸರಿ ಚಾಲ್ತಿ ಕೌಂಟರ್‌ಗಳು')}: <b>${c.avgCounters.toFixed(1)}</b></div>
      <div class="ticket-row">🌾 ${tr('Major Crop','मुख्य फसल','ಮುಖ್ಯ ಬೆಳೆ')}: <b>${c.topCrop}</b></div>
      <div class="ticket-row">📦 ${tr('Bookings on record','रिकॉर्ड में बुकिंग','ದಾಖಲೆಯಲ್ಲಿರುವ ಬುಕಿಂಗ್‌ಗಳು')}: <b>${c.count}</b></div>
      <div class="ticket-row">📊 ${tr('Best time to visit','आने का सही समय','ಭೇಟಿ ನೀಡಲು ಉತ್ತಮ ಸಮಯ')}: <b>${fmtHour(best.h)}</b></div>
      <div class="ticket-row">⚠️ ${tr('Usually busiest','सामान्यतः व्यस्त','ಸಾಮಾನ್ಯವಾಗಿ ಹೆಚ್ಚು ಜನಸಂದಣಿ')}: <b>${fmtHour(worst.h)}</b></div>
      <div class="hint">${tt().historicalNote(c.latest.bd)}</div>
    </div>`;
  addBot(html);
  setQuickReplies([{label: tr('Check another centre','दूसरा केंद्र देखें','ಬೇರೆ ಕೇಂದ್ರ ನೋಡಿ'), action: showCentreInfoFlow}, backChip()]);
}

/* ---------- 6. Best time to visit ---------- */
function showBestTimeFlow(){
  addBot(tt().chooseCentre);
  setQuickReplies([
    ...CENTRES.map(c => ({label: c.name, action: ()=>renderBestTime(c.pid)})),
    backChip()
  ]);
}
function renderBestTime(pid){
  const c = centreByPid(pid);
  const sorted = c.hourAvg;
  const n = sorted.length;
  const good = sorted.slice(0, Math.ceil(n/3));
  const bad = sorted.slice(-Math.ceil(n/3));
  const fmtList = arr => arr.map(x=>fmtHour(x.h)).sort().join(', ');
  const html = `
    <div class="ticket">
      <div class="ticket-head">🤖 ${c.name} — ${tr('Recommended visiting hours','आने के सुझाए गए समय','ಭೇಟಿಗೆ ಶಿಫಾರಸು ಮಾಡಿದ ಸಮಯ')}</div>
      <div class="ticket-row">🟢 ${tr('Usually shorter queues','सामान्यतः कम कतार','ಸಾಮಾನ್ಯವಾಗಿ ಕಡಿಮೆ ಸರತಿ')}: <b>${fmtList(good)}</b></div>
      <div class="ticket-row">🔴 ${tr('Usually busier','सामान्यतः व्यस्त','ಸಾಮಾನ್ಯವಾಗಿ ಹೆಚ್ಚು ಜನಸಂದಣಿ')}: <b>${fmtList(bad)}</b></div>
      <div class="hint">${tr('If your booking time is flexible, these hours have shown shorter queues in past records.','यदि आपका बुकिंग समय लचीला है, तो इन घंटों में पिछले रिकॉर्ड में कतार कम रही है।','ನಿಮ್ಮ ಬುಕಿಂಗ್ ಸಮಯ ಹೊಂದಿಕೊಳ್ಳುವಂತಿದ್ದರೆ, ಈ ಸಮಯಗಳಲ್ಲಿ ಹಿಂದಿನ ದಾಖಲೆಗಳಲ್ಲಿ ಸರತಿ ಕಡಿಮೆ ಇತ್ತು.')}</div>
      <div class="hint">${tt().historicalNote(c.latest.bd)}</div>
    </div>`;
  addBot(html);
  setQuickReplies([{label: tr('Check another centre','दूसरा केंद्र देखें','ಬೇರೆ ಕೇಂದ್ರ ನೋಡಿ'), action: showBestTimeFlow}, backChip()]);
}

/* ---------- 7. Overview across all centres ---------- */
function showOverview(){
  const rows = CENTRES.slice().sort((a,b)=>a.avgQ-b.avgQ).map(c => `
      <div class="overview-row">
        <span class="oc-name">📍 ${c.name}</span>
        <span class="oc-q">👥 ${Math.round(c.avgQ)}</span>
        <span class="oc-ctr">🏪 ${c.avgCounters.toFixed(1)}</span>
        ${statusBadge(c.avgQ)}
      </div>`).join('');
  const html = `
    <div class="ticket">
      <div class="ticket-head">📊 ${tr('Mandi Status Overview','मंडी की स्थिति','ಮಂಡಿ ಸ್ಥಿತಿ ಅವಲೋಕನ')}</div>
      ${rows}
      <div class="hint">${tr('Sorted from shortest to longest average queue, based on recorded data.','रिकॉर्ड किए गए डेटा के आधार पर सबसे छोटी से सबसे लंबी औसत कतार के क्रम में।','ದಾಖಲಿತ ಡೇಟಾ ಆಧಾರದ ಮೇಲೆ ಚಿಕ್ಕ ಸರತಿಯಿಂದ ದೊಡ್ಡ ಸರಾಸರಿ ಸರತಿಯವರೆಗೆ ಜೋಡಿಸಲಾಗಿದೆ.')}</div>
    </div>`;
  addBot(html);
  setQuickReplies([backChip()]);
}

/* ---------- Input form (used for Farmer ID entry) ---------- */
inputForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const val = textInput.value.trim();
  if (!val) return;
  addUser(val);
  textInput.value = '';
  if (state.pendingAction){
    const fn = state.pendingAction;
    state.pendingAction = null;
    fn(val);
  } else {
    addBot(tt().idlePrompt);
  }
});

langBtn.addEventListener('click', () => {
  const i = LANG_ORDER.indexOf(state.lang);
  state.lang = LANG_ORDER[(i+1) % LANG_ORDER.length];
  applyStaticText();
  buildTicker();
  showMainMenu(false);
  addBot(tt().welcome);
});

function applyStaticText(){
  titleEl.textContent = tt().title;
  taglineEl.textContent = tt().tagline;
  langBtn.textContent = NEXT_LABEL[state.lang];
  footerHelpEl.textContent = tt().footerHelp;
  textInput.placeholder = tt().inputPlaceholder;
}

function buildTicker(){
  const parts = CENTRES.map(c => `${c.name}: ${STATUS_META[queueStatus(c.avgQ)].dot} ${Math.round(c.avgQ)} ${tr('in queue','कतार में','ಸರತಿಯಲ್ಲಿ')}`);
  tickerEl.textContent = parts.join('   •   ');
}

/* ---------- Init ---------- */
applyStaticText();
buildTicker();
addBot(tt().welcome);
showMainMenu(false);

</script>
</body>
</html>
